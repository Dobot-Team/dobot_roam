# VLA training config for NuScenes-mini with InternVL3-1B

# Model
model:
  model_path: "/root/embodvla/models/OpenGVLab/InternVL3-1B"
  num_queries: 24  # Learnable query tokens; set to 1 for one query -> all data.n_future waypoints.
  freeze_vision: true
  freeze_llm: false
  freeze_mlp1: true
  action_head_type: "legacy"  # Use mlp_2, mlp_4, or mlp_6 for residual trajectory heads.
  action_head_dims: [512, 2]
  dtype: "bf16"  # bf16 / fp16 / fp32
  attn_implementation: "sdpa"   # eager / sdpa / flash_attention_2

# Data
data:
  dataroot: "/home/jovyan/work/data/nuscenes-mini"
  version: "v1.0-mini"
  cam_channel: "CAM_FRONT"
  num_history_frames: 4
  n_future: 24
  dt: 0.25
  input_size: 448
  batch_size: 1
  num_workers: 4
  val_split: 0.2
  prompt: "Predict the future trajectory of the ego vehicle."
  cache_dir: "./cache/nuscenes_vla_internvl3"
  num_image_tokens: 256
  max_length: 2048
  qwen_min_pixels: 3136
  qwen_max_pixels: 100000

# Training
training:
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 5000
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 64
  log_every_n_steps: 10

# Trainer (PyTorch Lightning)
trainer:
  accelerator: "gpu"
  devices: "auto"
  num_nodes: 1
  strategy: "ddp_find_unused_parameters_true"
  precision: "bf16-mixed"
  max_epochs: -1
  enable_checkpointing: true

# Outputs
output_dir: "./outputs/nuscenes_mini_internvl3_vla"
