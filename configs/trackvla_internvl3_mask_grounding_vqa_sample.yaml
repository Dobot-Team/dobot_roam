# MH4 TrackVLA trajectory + current-mask + grounding + VQA training.

model:
  model_path: "/workspace/model/InternVL3-1B-hf"
  model_type: "internvl3"
  num_queries: 8
  freeze_vision: true
  freeze_llm: false
  freeze_mlp1: false
  gradient_checkpointing: false
  action_head_type: "mlp6"
  action_head_dims: [512, 3]
  dtype: "bf16"
  attn_implementation: "sdpa"
  sam2_config:
    enabled: true
    checkpoint: "/workspace/model/sam2/sam2.1_hiera_base_plus.pt"
    feature_size: 16
    train_decoder: true
    current_mask:
      enabled: true
      loss_weight: 0.001
    future_masks:
      num_frames: 0
      frame_stride: 1
      loss_weight: 0.001
    use_high_res_features: true
  auxiliary_tasks_config:
    grounding_enabled: true
    vqa_enabled: true
    grounding_loss_weight: 0.01
    vqa_loss_weight: 0.01
    bbox_l1_weight: 5.0
    bbox_giou_weight: 2.0
    visibility_weight: 1.0
  history_compressor_config:
    enabled: true
    mode: "adaptive_pool"
    box_embedding: false
    num_output_tokens: 16
    num_layers: 3
    num_heads: 8
    hidden_size: 768
    dropout: 0.1
    mask_patch_threshold: 0.5

data:
  dataset_type: "trackvla"
  trackvla_sources: "/dataset/sample/at_train_60/dataset.json,/dataset/sample/dt_train_60/dataset.json,/dataset/sample/stt_train_70/dataset.json,/dataset/sample/dt_train_0.65/dataset.json"
  num_history_frames: 8
  history_frame_interval: 1
  n_future: 8
  trajectory_dim: 3
  input_size: 448
  batch_size: 8
  num_workers: 4
  val_split: 0.01
  prompt: "Predict the ego vehicle's future trajectory in the ego coordinate frame."
  num_image_tokens: 256
  max_length: 1200
  seed: 42
  index_cache_dir: "/workspace/dsj/cache/embodvla_trackvla_indexes_3x"
  max_open_archives: 32
  history_mask_augmentation:
    enabled: true
    clean_probability: 0.2

training:
  lr: 2.0e-5
  weight_decay: 0.001
  optimizer_param_groups:
    - name: llm
      patterns:
        - '^internvl\\.language_model\\.'
      lr: 2.0e-5
    - name: other
      patterns:
        - '.*'
      lr: 4.0e-5
  adamw:
    betas: [0.9, 0.98]
    eps: 1.0e-8
    amsgrad: false
  onecycle:
    cycle_momentum: false
  warmup_steps: 100
  max_steps: -1
  yaw_weight: 2.0
  x_weight: 1.0
  y_weight: 3.0
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 1000
  log_every_n_steps: 10

trainer:
  accelerator: "gpu"
  devices: "auto"
  num_nodes: 1
  strategy: "ddp_find_unused_parameters_true"
  precision: "bf16-mixed"
  max_epochs: 2
  enable_checkpointing: true
  save_top_k: 8
  save_last: true

output_dir: "/workspace/dsj/exps/embodvla_trackvla_internvl3_mh4_wmask_1dot4m_grounding_vqa"
