training:
  optimizer:
    type: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-06
    lr: 1.0e-05
    weight_decay: 1.0e-05
    use_param_groups: false
    parameter_groups:
    - name: backbone
      default: true
    - name: planner_head
      patterns:
      - act_token
      - planner_heads.*
      lr: 5.0e-05
  lr_scheduler:
    type: OneCycleLREarlyStop
    max_lr:
    - 1.0e-05
    - 5.0e-05
    div_factor: 10.0
    final_div_factor: 100.0
    annealing_effective_total_steps: 9000
    total_steps: 9000
    pct_start: 0.01
    cycle_momentum: false
    anneal_strategy: cos
    last_epoch: -1
  gradient_accum_steps: 2
  gradient_clip_val: 1.0
  save_every_n_steps: 3000
  save_total_limit: 4
trainer:
  accelerator: gpu
  devices: 8
  num_nodes: 1
  strategy: ddp_find_unused_parameters_true
  precision: bf16-mixed
  max_steps: 9000
  max_epochs: -1
  val_check_interval: 50000
  limit_val_batches: 256
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  enable_progress_bar: false
output_dir: outputs/qwen35_08B_omni_v2_base_v2v3data
