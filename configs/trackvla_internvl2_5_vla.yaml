# RGB-only TrackVLA trajectory training with InternVL 2.5-1B.
# Set model.model_path to the actual local checkpoint before training.

model:
  model_path: "OpenGVLab/InternVL2_5-1B"
  model_type: "internvl"          # Required when model_path is an HF repo ID.
  num_queries: 8                  # Learnable query tokens; set to 1 for one query -> all data.n_future waypoints.
  freeze_vision: true
  freeze_llm: true                # Train only trajectory query tokens + action head.
  freeze_mlp1: true
  gradient_checkpointing: true    # Needed to fit frozen-LLM backward on an 8 GB GPU.
  action_head_type: "legacy"     # Use mlp_2, mlp_4, or mlp_6 for residual trajectory heads.
  action_head_dims: [512, 3]      # TrackVLA trajectory is (x, y, yaw).
  dtype: "bf16"
  attn_implementation: "sdpa"    # eager / sdpa / flash_attention_2
  # Decoder-only, per-sample SAM2 supervision. The SAM2 source and default
  # SAM2.1 Base+ YAML are bundled in vla/sam2; only the checkpoint is external.
  sam2_config:
    enabled: false
    checkpoint: "vla/sam2/checkpoints/sam2.1_hiera_base_plus.pt"
    feature_size: 16
    train_decoder: true
    loss_weight: 0.1
    # null follows the selected SAM2 YAML; false uses the base decoder path.
    use_high_res_features: true

data:
  dataset_type: "trackvla"
  # The at_train subset has JSONL manifests and is a good first source.  Add
  # other subset paths with commas when enough CPU memory/time is available to
  # build their large dataset.json indexes.
  trackvla_sources: "data/trackvla-data/at_train_60"
  num_history_frames: 3           # Includes the current RGB frame.
  history_frame_interval: 1       # 0 means consecutive archive frames.
  n_future: 8
  trajectory_dim: 3
  input_size: 448
  batch_size: 1
  num_workers: 4
  val_split: 0.1                  # Split by .jpgs episode, never by frame.
  prompt: "Predict the follower's future trajectory in the ego coordinate frame."
  num_image_tokens: 256
  max_length: 896                 # Current one-frame/64-token prompt is 87 tokens.
  seed: 42
  # Caches only lazy metadata offsets, not images or masks.
  index_cache_dir: "./cache/trackvla_indexes"
  max_open_archives: 32

training:
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 5000
  max_epoch: -1
  yaw_weight: 2.0
  x_weight: 1.0
  y_weight: 3.0
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 500
  log_every_n_steps: 10

trainer:
  accelerator: "gpu"
  devices: "auto"
  num_nodes: 1
  strategy: "ddp_find_unused_parameters_true"
  precision: "bf16-mixed"
  max_epochs: -1
  enable_checkpointing: true

output_dir: "./outputs/trackvla_internvl2_5_vla"
