# VLA training config for Dobot post-sync data with InternVL 2.5-1B

# Model
model:
  model_path: "/root/embodvla/models/OpenGVLab/InternVL2_5-1B"
  num_queries: 8  # Learnable query tokens; set to 1 for one query -> all data.n_future waypoints.
  freeze_vision: true
  freeze_llm: false
  freeze_mlp1: true
  action_head_type: "legacy"  # legacy preserves checkpoints created before head presets.
  action_head_dims: [512, 3]  # (x, y, yaw)
  dtype: "bf16"  # bf16 / fp16 / fp32
  attn_implementation: "sdpa"   # eager / sdpa / flash_attention_2

# Data
data:
  dataset_type: "dobot"
  # For best IO performance, copy cam1 images to local/CPFS first:
  #   python tools/copy_dobot_data_local.py --json_list /root/embodvla_zhouyuan/outputs/post_sync_data/all_training_jsons.txt --local_root /mnt/cpfs/dobot_vla_local
  # Then override this path to the generated local list.
  training_json_list: "/root/embodvla_zhouyuan/outputs/post_sync_data/all_training_jsons.txt"
  cam_channel: "cam1"
  num_history_frames: 4
  history_duration: 1.0  # seconds over which the 4 history frames are spread
  n_future: 8  # 8 points @ 0.25s -> 2 seconds future
  future_dt: 0.25
  input_size: 448
  batch_size: 2
  num_workers: 4
  val_split: 0.1  # split by video (json file)
  sample_interval: 5  # one sample every 5 labels -> ~0.5s stride
  prompt: "Given the front camera history frames, predict the ego vehicle's future trajectory for the next 2 seconds. Output trajectory points in the ego coordinate frame where x points forward, y points to the left, and yaw is the relative heading angle. Provide 8 future trajectory points at 0.25-second intervals."
  cache_dir: "./cache/dobot_vla_2s"
  num_image_tokens: 256
  max_length: 1200  # ~1050 tokens for 4 images + prompt; 2048 wastes memory
  seed: 42
  num_build_workers: 8  # parallel video sample-cache construction
  use_scene_desc: true          # prepend bag_meta.scene_desc to prompt if available
  scene_desc_augment: true      # paraphrase person-following scene_desc with varied syntax

# Training
training:
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 5000
  yaw_weight: 2.0  # weight for yaw MSE
  x_weight: 1.0    # weight for x MSE
  y_weight: 3.0    # weight for y MSE (upweight lateral motion)
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 2000
  log_every_n_steps: 10

# Trainer (PyTorch Lightning)
trainer:
  accelerator: "gpu"
  devices: "auto"
  num_nodes: 1
  strategy: "ddp_find_unused_parameters_true"
  precision: "bf16-mixed"
  max_epochs: -1
  enable_checkpointing: true

# Outputs
output_dir: "./outputs/dobot_internvl2_5_vla"
