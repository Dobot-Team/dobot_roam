# TrackVLA trajectory + mask training with an independently selected ViT and LLM.
# DINOv3 is gated on Hugging Face; accept its license before first download.

model:
  model_type: "custom"
  # 独立选择视觉编码器和 LLM；两者不需要来自同一个多模态 checkpoint。
  vision_model_path: "facebook/dinov3-vits16-pretrain-lvd1689m"
  llm_model_path: "OpenGVLab/InternVL3_5-1B"
  custom:
    # null 表示分别复用 vision_model_path 和 llm_model_path 中的处理器。
    image_processor_path: null
    tokenizer_path: null
    # -1 使用 ViT 最后一层；其他整数按 Hugging Face hidden_states 下标取层。
    vision_feature_layer: -1
    # auto 自动裁掉 CLS 和 register tokens；也可显式填写要裁掉的 prefix 数量。
    vision_prefix_tokens: "auto"
    vision_trust_remote_code: false
    # vision_model_path 也可以直接指向多模态 checkpoint。auto 会抽取：
    # InternVL3 的 vision_tower、InternVL3.5/旧版 InternVL 的 vision_model，
    # 以及 Qwen3-VL 的 visual（后者自动采用其 patchified 输入格式）。
    # 要覆盖自动选择时填写具体属性路径，如 "vision_tower" 或 "visual"。
    vision_adapter: "auto"       # auto | standard | qwen3vl
    vision_submodule: "auto"

    # 控制每帧送入 projector/LLM 的视觉 token 数量：
    #   none:          不缩减。448 + ViT-S/16 的原始网格为 28x28=784 tokens。
    #   pool:          按缩减倍数执行 AdaptiveAvgPool2d，通道维度不变。
    #   pixel_shuffle: 按缩减倍数执行 InternVL v2 space-to-depth，通道维度扩大 factor^2。
    vision_token_reduction: "pixel_shuffle"
    # 空间缩减倍数；必须同时整除原始网格的高和宽。
    # 当前原始网格为 28x28，factor=2 后为 14x14=196 tokens。
    # vision_token_reduction=none 时必须为 1；pool/pixel_shuffle 时必须大于 1。
    vision_token_reduction_factor: 2

    # nested_vlm: llm_model_path 指向完整 VLM，加载后从中抽取语言模型；
    # causal_lm:  llm_model_path 指向独立 AutoModelForCausalLM，此时 llm_submodule 不使用。
    llm_loader: "nested_vlm"
    # nested_vlm 中 LLM 相对完整 VLM 的属性路径：full_vlm.language_model。
    llm_submodule: "language_model"
    # LLM 内部 decoder 的属性路径：language_model.model。CustomVLA 直接读取其
    # last_hidden_state，不计算词表 logits。
    llm_decoder_submodule: "model"
    # InternVL3.5 使用仓库自定义模型代码，因此必须开启；独立原生 CausalLM 通常关闭。
    llm_trust_remote_code: true

    # projector 固定为 LayerNorm -> Linear -> GELU -> Linear。
    projector_type: "mlp2x_gelu"
    # null 表示中间维度使用 LLM hidden size；也可填写正整数覆盖。
    projector_hidden_size: null
    # random: 独立 ViT 默认随机初始化。pretrained: 从 vision_model_path 指向的
    # 完整 InternVL VLM 复用 multi_modal_projector/mlp1；DINOv3 等独立 ViT 不支持。
    projector_init: "random"
    # 正常 checkpoint 保持 null，由父 VLM/tokenizer 自动解析 image token。
    # 仅损坏或非标准转换的 checkpoint 才手工覆盖。
    image_token_override: null

  num_queries: 8
  freeze_vision: true
  freeze_llm: false
  freeze_action_head: false
  gradient_checkpointing: true
  action_head_type: "legacy"
  action_head_dims: [512, 3]
  dtype: "bf16"
  attn_implementation: "sdpa"
  sam2_config:
    enabled: true
    checkpoint: "vla/sam2/checkpoints/sam2.1_hiera_base_plus.pt"
    feature_size: 16
    train_decoder: true
    loss_weight: 0.01
    use_high_res_features: true
  history_compressor_config:
    enabled: true
    mode: "q_identity"
    box_embedding: false
    # 只控制每个过去帧的二次压缩 token 数；当前帧仍保留上面的 14x14=196 tokens。
    # 当前 4 帧最终视觉布局为 [16, 16, 16, 196]。
    num_output_tokens: 16
    num_layers: 2
    num_heads: 8
    hidden_size: 512
    dropout: 0.1
    mask_patch_threshold: 0.25

data:
  dataset_type: "trackvla"
  trackvla_sources: "data/trackvla-data/at_train_60"
  num_history_frames: 8
  history_frame_interval: 1
  n_future: 8
  trajectory_dim: 3
  input_size: 448
  # 不必填写 num_image_tokens：模型根据缩减后网格自动推导为 14^2=196，
  # 并写入输出目录的 config.yaml；若显式填写，必须与推导值完全一致。
  batch_size: 4
  num_workers: 4
  val_split: 0.005
  prompt: "Predict the follower's future trajectory in the ego coordinate frame."
  max_length: 1200
  seed: 42
  index_cache_dir: "./cache/trackvla_indexes_custom_dinov3"
  max_open_archives: 32
  history_mask_augmentation:
    enabled: true
    clean_probability: 0.2

training:
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: -1
  yaw_weight: 2.0
  x_weight: 1.0
  y_weight: 3.0
  gradient_clip_val: 1.0
  accumulate_grad_batches: 16
  val_check_interval: 5000
  log_every_n_steps: 10

trainer:
  accelerator: "gpu"
  devices: "auto"
  num_nodes: 1
  strategy: "ddp_find_unused_parameters_true"
  precision: "bf16-mixed"
  max_epochs: 1
  enable_checkpointing: true

output_dir: "./outputs/trackvla_custom_dinov3_internvl3_5_vla"
