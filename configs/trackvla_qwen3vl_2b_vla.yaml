# TrackVLA trajectory + current-mask training with dense Qwen3-VL.
# The same adapter supports the dense 4B/8B Instruct checkpoints by changing
# model_path. Qwen3-VL MoE checkpoints are intentionally unsupported.

model:
  model_path: "Qwen/Qwen3-VL-2B-Instruct"
  model_type: "qwen3vl"
  num_queries: 8
  freeze_vision: true
  freeze_llm: false
  freeze_action_head: false
  gradient_checkpointing: true
  action_head_type: "legacy"
  action_head_dims: [512, 3]
  dtype: "bf16"
  attn_implementation: "sdpa"
  # Qwen3-VL DeepStack features are always discarded by this adapter. Only
  # the final merged visual embeddings enter the LLM and history compressor.
  sam2_config:
    enabled: true
    checkpoint: "vla/sam2/checkpoints/sam2.1_hiera_base_plus.pt"
    feature_size: 16
    train_decoder: true
    loss_weight: 0.01
    use_high_res_features: true
  history_compressor_config:
    enabled: true
    mode: "q_identity"
    box_embedding: false
    num_output_tokens: 16
    num_layers: 2
    num_heads: 8
    hidden_size: 512
    dropout: 0.1
    mask_patch_threshold: 0.25

data:
  dataset_type: "trackvla"
  trackvla_sources: "data/trackvla-data/at_train_60,data/trackvla-data/dt_train_60,data/trackvla-data/stt_train_70"
  num_history_frames: 4
  history_frame_interval: 1
  n_future: 8
  trajectory_dim: 3
  # Qwen3-VL uses patch_size=16 and spatial_merge_size=2. A fixed padded
  # 448x448 image therefore produces a 14x14 grid (196 merged tokens).
  input_size: 448
  num_image_tokens: 196
  batch_size: 2
  num_workers: 4
  val_split: 0.005
  prompt: "Predict the follower's future trajectory in the ego coordinate frame."
  max_length: 1200
  seed: 42
  index_cache_dir: "./cache/trackvla_indexes_qwen3vl"
  max_open_archives: 32
  history_mask_augmentation:
    enabled: true
    clean_probability: 0.2

training:
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: -1
  yaw_weight: 2.0
  x_weight: 1.0
  y_weight: 3.0
  gradient_clip_val: 1.0
  accumulate_grad_batches: 16
  val_check_interval: 5000
  log_every_n_steps: 10

trainer:
  accelerator: "gpu"
  devices: "auto"
  num_nodes: 1
  strategy: "ddp_find_unused_parameters_true"
  precision: "bf16-mixed"
  max_epochs: 1
  enable_checkpointing: true

output_dir: "./outputs/trackvla_qwen3vl_2b_vla"
