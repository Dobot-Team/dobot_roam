# RGB-only TrackVLA trajectory training with a Qwen2-VL-1B-compatible checkpoint.
# Replace model.model_path with the actual local checkpoint directory. The checkpoint
# must be compatible with Qwen2VLForConditionalGeneration.

model:
  model_path: "models/Qwen/Qwen2-VL-1B-Instruct"
  model_type: "qwen2vl"
  num_queries: 8
  freeze_vision: true
  freeze_llm: true
  freeze_action_head: false
  action_head_type: "mlp_2"
  action_head_dims: [512, 3]
  dtype: "bf16"
  attn_implementation: "sdpa"

data:
  dataset_type: "trackvla"
  trackvla_sources: "data/trackvla-data/at_train_60"
  num_history_frames: 3
  history_frame_interval: 1
  n_future: 8
  trajectory_dim: 3
  input_size: 448
  batch_size: 1
  num_workers: 4
  val_split: 0.1
  prompt: "Predict the follower's future trajectory in the ego coordinate frame."
  max_length: 2048
  qwen_min_pixels: 3136
  qwen_max_pixels: 100000
  seed: 42
  index_cache_dir: "./cache/trackvla_indexes_qwen2vl_1b"
  max_open_archives: 32

training:
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 5000
  yaw_weight: 2.0
  x_weight: 1.0
  y_weight: 3.0
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 500
  log_every_n_steps: 10

trainer:
  accelerator: "gpu"
  devices: "auto"
  num_nodes: 1
  strategy: "ddp_find_unused_parameters_true"
  precision: "bf16-mixed"
  max_epochs: -1
  enable_checkpointing: true

output_dir: "./outputs/trackvla_qwen2vl_1b_vla"
