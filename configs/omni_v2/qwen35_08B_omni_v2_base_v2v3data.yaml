# Migrated from DobotNav c4a7f59. Training semantics preserved; tokenizer uses the local model mount.
# One Lightning batch is one optimizer step containing gradient_accum_steps microbatches.
seed: 42
model:
  model_type: qwen35_omni
  planner:
    type: OmniVLNPlannerWithActToken
    image_token_id: 248056
    video_token_id: 248057
    use_uint8_input_images: true
    normalized_data_type: fp32
    normalize_images: true
    image_mean:
    - 0.5
    - 0.5
    - 0.5
    image_std:
    - 0.5
    - 0.5
    - 0.5
    freeze_patterns: []
    output_scale:
    - 2.0
    - 2.0
    - 1.0
    vision_language_model:
      type: OfficialQwen35VLM
      pretrained_path: /mnt/mh4-local-nvme/users/wcr/data/wcr/weights/public/qwen/qwen3.5_0.8B/model.safetensors-00001-of-00001.safetensors
      pretrained_strict: false
      treat_image_sequence_as_video: true
      text_config:
        vocab_size: 248320
        hidden_size: 1024
        intermediate_size: 3584
        num_hidden_layers: 24
        num_attention_heads: 8
        num_key_value_heads: 2
        head_dim: 256
        hidden_act: silu
        rms_norm_eps: 1.0e-06
        tie_word_embeddings: true
        attention_bias: false
        attn_output_gate: true
        linear_conv_kernel_dim: 4
        linear_key_head_dim: 128
        linear_value_head_dim: 128
        linear_num_key_heads: 16
        linear_num_value_heads: 16
        full_attention_interval: 4
        max_position_embeddings: 262144
        rope_parameters:
          rope_type: default
          rope_theta: 10000000
          partial_rotary_factor: 0.25
          mrope_interleaved: true
          mrope_section:
          - 11
          - 11
          - 10
      vision_config:
        depth: 12
        hidden_size: 768
        hidden_act: gelu_pytorch_tanh
        intermediate_size: 3072
        num_heads: 12
        in_channels: 3
        patch_size: 16
        spatial_merge_size: 2
        temporal_patch_size: 2
        out_hidden_size: 1024
        num_position_embeddings: 2304
    trajectory_pred_head:
      type: OmTrackPlannerHead
      input_channels: 1024
      hidden_channels:
      - 2048
      - 2048
      num_waypoints: 8
      coord_dim: 3
      use_tanh: false
    task_loss:
      type: TaskAwareTrajectoryRegressionLoss
      loss_fn: mse
      coord_scale:
      - 2.0
      - 2.0
      - 1.0
      global_loss_scale: 10.0
      loss_weights:
        tracking: 1.0
        roaming: 1.0
        intent: 1.0
        point_nav: 1.0
        image_nav: 1.0
data:
  dataset_type: omni
  training_dataloader:
    type: DataLoader
    batch_size: 72
    num_workers: 2
    drop_last: true
    pin_memory: true
    persistent_workers: true
    dataset:
      type: DobotOmniRGBDataset
      json_path: /mnt/mh4-local-nvme/users/wcr/data/wcr/datasets/20261015/dobot/train
      additional_json_paths:
      - /mnt/mh4-local-nvme/users/wcr/data/wcr/datasets/20260828/trackvla/train
      - /mnt/mh4-local-nvme/users/wcr/data/wcr/datasets/20261018/dobot/train
      task_sampling:
        seed: 42
        samples_per_epoch: auto
        ratios:
          tracking: 0.4
          roaming: 0.3
          intent: 0.05
          point_nav: 0.15
          image_nav: 0.1
      source_sampling:
        mode: conditional
        weights_by_task:
          tracking:
            dobot_tracking: 3.0
            trackvla_at: 1.0
            trackvla_dt: 1.0
            trackvla_stt: 1.0
          roaming:
            dobot_roaming: 1.0
          intent:
            dobot_roaming: 1.0
          point_nav:
            dobot_roaming: 1.0
          image_nav:
            dobot_roaming: 1.0
      future_goal_sampling:
        min_future_s: 0.3
        near_max_s: 2.4
        max_future_s: 4.8
        near_probability: 0.8
        far_probability: 0.2
        near_bin_width_s: 0.3
      task_processors:
        tracking:
          type: TrackingTaskProcessor
        roaming:
          type: RoamingTaskProcessor
          instruction: Roam slowly while prioritizing safety.
        intent:
          type: IntentTaskProcessor
          prompts:
            left_turn: Turn left.
            forward_left: Move forward-left.
            straight: Go straight.
            forward_right: Move forward-right.
            right_turn: Turn right.
            stop: Stop.
          stop_max_translation_m: 0.2
          stop_max_abs_yaw_rad: 0.15
          straight_max_abs_yaw_rad: 0.15
          straight_max_abs_path_bearing_rad: 0.15
          turn_min_abs_deviation_rad: 0.45
        point_nav:
          type: PointNavigationTaskProcessor
          instruction_template: Move to the point({x:.3f}, {y:.3f}).
        image_nav:
          type: ImageNavigationTaskProcessor
          instruction_template: Move to the place in the {image}.
      history: 31
      num_waypoints: 8
      coord_dim: 3
      trajectory_dt: 0.1
      waypoint_dt: 0.3
      trajectory_padding_value: -1.0
      trackvla_time_retargeting:
        enabled: true
        path_component: trackvla
        action_integration_dt: 0.025
        simulator_ctrl_freq_hz: 40.0
        record_frequency_hz: 10.0
        speed_coefficients_by_source:
          at_train_60:
          - 15.0
          - 5.0
          - 6.28
          dt_train_0.65:
          - 15.0
          - 10.0
          - 6.28
          dt_train_60:
          - 15.0
          - 10.0
          - 6.28
          stt_train_70:
          - 15.0
          - 10.0
          - 6.28
        dobot_speed_v1_mps: 1.2
        trackvla_speed_v2_mps: 3.6
        preserve_original_horizon_mask: false
      shuffle: true
      seed: 42
      mode: train
      history_padding: earliest
      worker_shard_batch_size: null
      shuffle_block_size: 256
      raw_camera: undist_cam1
      raw_record_cache_size: 16
      img_size: 256
      num_input_frames: 5
      input_hz: 2.0
      temporal_patch_size: 2
      frame_index_hz: 10.0
      resample_on_error: true
      max_resample_times: 100
      data_processor_list:
      - type: OmniVLNPromptProcessor
        tokenizer_path: /mnt/mh4-local-nvme/users/wcr/data/wcr/weights/public/qwen/qwen3.5_0.8B/tokenizer.json
        num_image_tokens: null
        system_prompt: You are the navigation policy of a quadruped robot. Given the
          observations and the instruction, decide where to go next.
        instruction_template: Follow the person who is {TARGET_DESC}.
        use_origin_prompt: true
        image_token_id: 248056
        video_token_id: 248057
        vision_start_id: 248053
        vision_end_id: 248054
        use_vision_markers: true
        vision_token_type: video
        split_video_by_timestamps: true
        timestamp_template: <{time:.2f}s>
      - type: OmniRGBNoiseProcessor
        std: 3.0
    collate_fn:
      type: omni_planner_collate_fn
  validation_dataloader:
    type: DataLoader
    batch_size: 4
    num_workers: 2
    drop_last: false
    pin_memory: true
    persistent_workers: true
    dataset:
